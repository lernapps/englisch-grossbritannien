# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Orte, Befehle und Zahlen noch einmal kurz, bevor Sophie und Ellie durch Millbrook gehen.
recap: [englisch/praepositionen-ort, englisch/imperativ, englisch/zahlen]
scope: "Die Seite wiederholt nur drei Bausteine aus früheren Apps: Präpositionen des Ortes, den Imperativ und Zahlen mit Preisen. Neue Inhalte und Übungen gibt es nicht."
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Sophie (11) kommt aus Deutschland und wohnt bei der Familie Parker in Millbrook. **Ellie Parker** (11) ist ihre Gastschwester. Ellies kleiner Bruder **Peter** ist 9. **Mrs Parker** ist Ellies Mutter und Sophies Gastmutter. **Mr Hill** ist der Englischlehrer, und **Amir** (11) ist ein Freund aus der Klasse. Am Samstag gehen Sophie und Ellie mit einem Stadtplan durch die Stadt. Dafür brauchst du drei Bausteine, die du schon kennst. Prüfe in Gedanken, ob du sie kannst."
      - type: text
        text: |
          Das sind die drei Bausteine, jeweils mit dem „Ich kann“-Satz:

          - **Ich kann mit Präpositionen wie in, on, under, next to und behind sagen, wo etwas ist.** Das ist der Baustein „Präpositionen des Ortes“.
          - **Ich kann Aufforderungen und Verbote mit dem Imperativ formulieren (Open the door. Don’t run.).** Das ist der Baustein „Imperativ“.
          - **Ich kann Grund- und Ordnungszahlen sagen und schreiben, auch große Zahlen und Preise.** Das ist der Baustein „Zahlen und Preise“.
      - type: table
        caption: Klassenzimmer-Poster · Das brauchst du für den Plan
        header: [Das willst du sagen, Beispiel]
        rows:
          - [wo etwas ist, The ball is under the table.]
          - [jemanden auffordern, Open the window.]
          - [jemanden warnen, Don’t run.]
          - [eine Zahl nennen, twenty-five]
      - type: text
        text: "Nicht sicher? Wiederhole es auf den Seiten der Lernlandkarte: [Präpositionen des Ortes](https://lernapps.net/apps/map/englisch/c/praepositionen-ort/), [Imperativ](https://lernapps.net/apps/map/englisch/c/imperativ/) und [Zahlen und Preise](https://lernapps.net/apps/map/englisch/c/zahlen/)."
      - type: text
        text: "Gleich gehen Sophie und Ellie los."
