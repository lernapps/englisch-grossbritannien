# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Sehenswürdigkeiten in London
description: Mr Hills Klasse macht einen Stadtrundgang an der Themse. Du lernst sechs wichtige Orte kennen und beschreibst sie mit is, has und you can.
competencies: [london-sehenswuerdigkeiten]
scope: "Die Seite zeigt eine Schemakarte von London mit der Themse und sechs nummerierten Halten: Tower of London, Tower Bridge, London Eye, Big Ben, Buckingham Palace und British Museum. Beschrieben wird mit It is a/an …, It has … und You can … sowie on the River Thames, near und in. Typische Fehler sind Big Ben als Name des Turms, a und an, on und near. Nicht hier, weil sie auf späteren Seiten folgen: Fahrkarten und Wege in London und die Geschichte nach den Römern."
blocks:
  - type: section
    id: einstieg
    title: Der Stadtrundgang
    blocks:
      - type: figure
        image: images/szene-london-rundgang.svg
        alt: Ein Mann mit grauen Haaren, ein Junge mit Brille und ein Mädchen mit Zöpfen gehen an einem Fluss entlang, hinter ihnen stehen Häuser.
        caption: "Von links: Mr Hill (graue Haare), Amir (Brille, schwarze Locken) und Sophie (blonde Zöpfe)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Heute macht die Klasse einen Stadtrundgang. Mr Hill hat eine **Schemakarte** von London dabei: eine einfache Karte, die nicht genau nach Maßstab ist. Sechs Halte sind nummeriert. Peter ist heute nicht dabei, deshalb schreibt Sophie ihm später eine Postkarte. Mr Hill sagt: „We walk along the River Thames.“"
      - type: single-choice
        id: lon-start
        text: "Was ist die Themse (the River Thames)?"
        options:
          - text: ein Fluss
            correct: true
            info: river heißt Fluss. Die Themse fließt durch London.
          - text: eine Straße
            correct: false
            info: Straße heißt street oder road. river ist ein Fluss.
          - text: ein Park
            correct: false
            info: Park heißt park. river ist ein Fluss mit Wasser.
        explanation: River heißt Fluss. Mr Hill sagt, dass die Klasse am Fluss entlang geht.
        links:
          - title: Lernlandkarte Englisch · Sehenswürdigkeiten in London
            url: https://lernapps.net/apps/map/englisch/c/london-sehenswuerdigkeiten/
      - type: text
        text: "**Das kannst du danach:** Du nennst wichtige Orte in London und beschreibst sie in einfachen Sätzen: Was ist es, wo liegt es und was kannst du dort tun?"
  - type: section
    id: neu
    title: Sechs Halte an der Karte
    blocks:
      - type: figure
        image: images/london-karte.svg
        alt: Schemakarte von London. Die Themse verläuft als breites blaues Band von links nach rechts. Sechs nummerierte Halte mit ihren Namen liegen nördlich, südlich und an dem Fluss. Schemakarte, nicht genau nach Maßstab.
        caption: Schemakarte, nicht genau nach Maßstab. Norden ist oben, Osten rechts. Die Themse fließt von West nach Ost.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Der **Tower of London** ist eine Burg am Nordufer der Themse. Die **Tower Bridge** ist eine Brücke über die Themse, gleich beim Tower. Sie wurde von 1886 bis 1894 gebaut. Das **London Eye** ist ein Riesenrad am Südufer. **Big Ben** gehört zum Parlament: eine große Glocke (bell) mit einer Uhr (clock). Der **Buckingham Palace** ist der Amtssitz des Königs oder der Königin in London. Das **British Museum** liegt im Stadtteil Bloomsbury und wurde 1753 gegründet."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              So beschreibst du einen Ort: **It is a** … sagt, was es ist. **It has** … sagt, was es hat. **You can** … sagt, was du dort tun kannst. Vor einem Vokal-Laut steht **an**: an old church, aber a big church. Ein Ort direkt am Fluss liegt **on the river**, in der Nähe heißt **near**. Zum Beispiel: It is a big school in a park. It has a nice garden. You can play football there.
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [bridge, Brücke]
          - [big wheel, Riesenrad]
          - [tower, Turm]
          - [castle, Burg]
          - [palace, Palast]
          - [Thames, Themse (Fluss in London)]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: lon-beschreibung
        text: Welcher Satz beschreibt welchen Ort? Ordne zu.
        pairs:
          - left: It is a bridge with two towers.
            right: Tower Bridge
          - left: It is a big wheel on the river.
            right: London Eye
          - left: It is a museum in Bloomsbury.
            right: British Museum
          - left: It has a very big bell.
            right: Big Ben
        explanation: Die Brücke mit den zwei Türmen ist die Tower Bridge. Das Riesenrad ist das London Eye. Das Museum in Bloomsbury ist das British Museum. Die große Glocke gehört zu Big Ben.
        hint: Denke an die Karte. Ein Wort in jedem Satz verrät den Ort (bridge, wheel, museum, bell).
        links:
          - title: Lernlandkarte Englisch · Sehenswürdigkeiten in London
            url: https://lernapps.net/apps/map/englisch/c/london-sehenswuerdigkeiten/
      - type: language-task
        id: lon-karte
        languages: { source: de, target: en }
        mode: choice
        task: Auf dieser Karte stehen nur Nummern. Wähle den richtigen Ort.
        form: { case: hint, punctuation: ok }
        material:
          - type: figure
            image: images/london-karte-nummern.svg
            alt: Schemakarte von London mit der Themse und sechs nummerierten Halten ohne Namen. Schemakarte, nicht genau nach Maßstab.
            caption: Schemakarte, nicht genau nach Maßstab. Norden ist oben, Osten rechts.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        items:
          - cue: Halt 1 liegt im Osten, nördlich der Themse.
            target: Stop one is [the Tower of London].
            distractors: [[the British Museum, Buckingham Palace]]
            mistakes:
              - answer: Stop one is the British Museum.
                message: Das British Museum liegt weit im Norden, nicht am Fluss im Osten.
              - answer: Stop one is Buckingham Palace.
                message: Der Buckingham Palace liegt im Westen, nicht im Osten.
          - cue: Halt 3 liegt südlich der Themse.
            target: Stop three is [the London Eye].
            distractors: [[the Tower of London, the British Museum]]
            mistakes:
              - answer: Stop three is the Tower of London.
                message: Der Tower of London liegt nördlich der Themse.
              - answer: Stop three is the British Museum.
                message: Das British Museum liegt weit nördlich der Themse.
          - cue: Halt 6 liegt ganz im Norden, weit weg vom Fluss.
            target: Stop six is [the British Museum].
            distractors: [[the London Eye, the Tower of London]]
            mistakes:
              - answer: Stop six is the London Eye.
                message: Das London Eye steht am Südufer, direkt an der Themse.
              - answer: Stop six is the Tower of London.
                message: Der Tower of London liegt am Fluss im Osten.
        hint: Schau, ob der Halt nördlich oder südlich der Themse liegt und ob er im Osten oder Westen ist.
      - type: single-choice
        id: lon-bigben
        text: "Amir fragt nach einem Foto vom Parlament: „Is Big Ben the name of the tower?“ Was stimmt?"
        options:
          - text: Big Ben ist der Spitzname der großen Glocke, im weiteren Sinn auch des Uhrturms.
            correct: true
            info: Big Ben nennt man die Glocke. Viele nennen so auch den ganzen Turm, aber das ist nur ein Spitzname.
          - text: Big Ben ist der offizielle Name des ganzen Turms.
            correct: false
            info: Der Turm hat einen anderen Namen, Elizabeth Tower. Big Ben ist der Spitzname der Glocke.
          - text: Big Ben ist eine Brücke über die Themse.
            correct: false
            info: Eine Brücke heißt bridge. Big Ben ist eine Glocke und ein Spitzname.
        explanation: Big Ben ist der Spitzname der großen Glocke und, im weiteren Sinn, des Uhrturms. Der Turm selbst heißt heute Elizabeth Tower.
        links:
          - title: Lernlandkarte Englisch · Sehenswürdigkeiten in London
            url: https://lernapps.net/apps/map/englisch/c/london-sehenswuerdigkeiten/
      - type: ordering
        id: lon-ordnen
        text: Bringe die Wörter in die richtige Reihenfolge, so dass ein Satz entsteht.
        items: [It, is, a, bridge, over, the, River, Thames]
        explanation: Zuerst kommt It is a, dann das Nomen bridge und zuletzt der Ort over the River Thames.
        hint: Der Satz beginnt mit It. Nach is steht a und dann das Nomen.
        links:
          - title: Lernlandkarte Englisch · Sehenswürdigkeiten in London
            url: https://lernapps.net/apps/map/englisch/c/london-sehenswuerdigkeiten/
      - type: language-task
        id: lon-form
        languages: { source: de, target: en }
        mode: choice
        task: Wähle das richtige Wort.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Das ist ein altes Museum.
            target: It is [an] old museum.
            distractors: [[a]]
            mistakes:
              - answer: It is a old museum.
                message: old beginnt mit einem Vokal-Laut. Dann steht an, nicht a.
          - cue: Es ist ein großer Palast.
            target: It is [a] big palace.
            distractors: [[an]]
            mistakes:
              - answer: It is an big palace.
                message: big beginnt mit einem Konsonanten-Laut. Dann steht a, nicht an.
          - cue: Die Brücke ist in der Nähe der Burg.
            target: The bridge is [near] the castle.
            distractors: [[on, in]]
            mistakes:
              - answer: The bridge is on the castle.
                message: on heißt auf oder direkt an. In der Nähe heißt near.
              - answer: The bridge is in the castle.
                message: in heißt in. In der Nähe heißt near.
          - cue: Die Burg liegt direkt am Fluss.
            target: The castle is [on] the River Thames.
            distractors: [[in, at]]
            mistakes:
              - answer: The castle is in the River Thames.
                message: in the River hieße mitten im Wasser. Direkt am Fluss sagst du on the River.
              - answer: The castle is at the River Thames.
                message: Bei einem Fluss sagst du on the River Thames.
        hint: Prüfe den ersten Laut des nächsten Worts für a und an. Für den Ort denke an near und on.
      - type: language-task
        id: lon-schreiben
        languages: { source: de, target: en }
        task: Schreibe die Sätze auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Das ist ein Museum in London.
            target: (It|This) is a museum in London.
            mistakes:
              - answer: It is a museum on London.
                message: Eine Stadt ist ein Ort, in dem du bist. Dafür brauchst du in.
              - answer: Is a museum in London.
                message: Ein englischer Satz braucht ein Subjekt. Schreibe It is.
          - source: Es hat eine große Uhr.
            target: It (has|has got) a big clock.
            mistakes:
              - answer: It have a big clock.
                message: Bei it heißt es has, nicht have.
          - source: Du kannst dort Bilder sehen.
            target: You can see pictures there.
            mistakes:
              - answer: You can to see pictures there.
                message: Nach can steht das Verb ohne to.
              - answer: You can seeing pictures there.
                message: Nach can steht die Grundform, ohne -ing.
        hint: Beginne mit It is, It has oder You can. Nach can steht kein to.
      - type: language-task
        id: lon-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: mr-hill-has-a-map-of-london.mp3
            target: Mr Hill has a map of London.
          - audio: the-class-walks-along-the-river.mp3
            target: The class walks along the river.
          - audio: sophie-takes-a-photo-of-the-palace.mp3
            target: Sophie takes a photo of the palace.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: lon-nachsprechen
        language: en
        items:
          - audio: big-ben-is-a-famous-bell-in-london.mp3
            text: Big Ben is a famous bell in London.
          - audio: many-visitors-take-photos-of-the-bridges.mp3
            text: Many visitors take photos of the bridges.
          - audio: amir-likes-the-british-museum.mp3
            text: Amir likes the British Museum.
        hint: Hör den Satz zuerst. Sprich dann langsam nach und achte auf famous, Bridge und museum.
      - type: open-task
        id: lon-postkarte
        task: "Sophie schreibt Peter eine Postkarte aus London. Schreibe zwei Sätze über einen Ort, den die Klasse gesehen hat."
        points:
          - text: Du nennst einen der sechs Orte mit seinem richtigen Namen.
            source: /london/london-sehenswuerdigkeiten/#neu
          - text: Du beschreibst ihn mit It is a/an … oder It has … oder You can ….
            source: /london/london-sehenswuerdigkeiten/#neu
          - text: a und an stehen richtig, und die Ortsangabe passt (on the River Thames, near, in).
            source: /london/london-sehenswuerdigkeiten/#neu
          - text: Es sind ganze Sätze mit Punkt am Ende.
            kind: form
        solution: |
          This is Tower Bridge. It is a famous bridge near the Tower of London.
  - type: section
    id: weiter
    title: Weiter durch London
    blocks:
      - type: text
        text: In der Mittagspause setzen sich die Kinder in einen Park. Dort erzählen sie von ihren Familien, und Mr Hill fragt die Kinder danach. Wie du von den Menschen in Großbritannien erzählst, erfährst du auf der nächsten Seite.
