# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Vergleiche mit than und as … as noch einmal kurz, bevor Mr Hill die große Karte aufhängt.
recap: [englisch/vergleiche]
scope: "Die Seite wiederholt nur einen Baustein aus einer früheren App: Vergleiche mit than, as … as und not as … as. Gebraucht wird er auf der Seite über Stadt und Land. Neue Inhalte und Übungen gibt es nicht."
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Jetzt zoomt die Karte heraus: Du siehst nicht mehr die Straßen, sondern ein ganzes Land. Am Ende des Kapitels vergleichst du Orte miteinander. Dafür brauchst du etwas, das du schon kennst."
      - type: text
        text: "**Ich kann mit than, as … as und not as … as vergleichen.** Das ist der Baustein „Vergleiche: than, as … as“. Mit **than** zeigst du einen Unterschied, mit **as … as** sagst du, dass zwei Dinge gleich sind, und mit **not as … as**, dass eines weniger ist."
      - type: table
        caption: Klassenzimmer-Poster · Das brauchst du für den Vergleich
        header: [Das willst du sagen, Beispiel]
        rows:
          - [ein Unterschied, A horse is faster than a dog.]
          - [gleich, My bag is as heavy as yours.]
          - [nicht gleich, A pony is not as big as a horse.]
      - type: text
        text: "Nicht sicher? Wiederhole es auf der Seite der Lernlandkarte: [Vergleiche: than, as … as](https://lernapps.net/apps/map/englisch/c/vergleiche/)."
