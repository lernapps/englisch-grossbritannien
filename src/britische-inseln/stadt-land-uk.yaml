# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Stadt und Land vergleichen"
description: Sophie vergleicht London, Millbrook und Cornwall. Du lernst, das Leben in einer Großstadt und auf dem Land mit than und as … as zu vergleichen.
competencies: [stadt-land-uk]
scope: "Die Seite vergleicht das Leben in einer Großstadt (London, Millbrook) und auf dem Land (Cornwall) mit Adjektiven wie noisy, quiet, busy, crowded, expensive, cheap, fast und slow. Gelernt werden -er … than, more … than, as … as und not as … as. Typische Fehler sind bigger then, more busy statt busier, as busier as und more quiet statt quieter. Es gibt keine Zahlen zu Einwohnern. Nicht hier, weil sie in einem späteren Kapitel folgen: London mit seinen Sehenswürdigkeiten."
blocks:
  - type: section
    id: einstieg
    title: Ellie vergleicht
    blocks:
      - type: figure
        image: images/stadt-land-bild.svg
        alt: Links eine Straße mit hohen Häusern und zwei Autos, davor ein Mädchen mit rotem Pferdeschwanz. Rechts grüne Hügel, ein Baum und ein kleines Haus, davor ein Mädchen mit blonden Zöpfen.
        caption: Links Ellie (roter Pferdeschwanz) in der Stadt, rechts Sophie (blonde Zöpfe) auf dem Land.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Auf der Seite davor hat Peter nach Cornwall gefragt. Beim Abendessen erzählt Ellie von London und von Millbrook. Sophie denkt nach. Sie kennt den Ort Millbrook und hat von London und von Cornwall gehört. Wo ist mehr los, und wo ist es ruhiger? Sophie vergleicht."
      - type: single-choice
        id: stadt-start
        text: "Ellie sagt: „London is bigger than Millbrook.“ Was heißt das?"
        options:
          - text: London ist größer als Millbrook.
            correct: true
            info: "bigger than heißt „größer als“. Ellie sagt, dass London größer ist."
          - text: London ist so groß wie Millbrook.
            correct: false
            info: "„So groß wie“ heißt as big as. Ellie sagt bigger than."
          - text: Millbrook ist größer als London.
            correct: false
            info: Hier sind die Orte vertauscht. In Ellies Satz steht London vor than, und London ist das größere.
        explanation: "„London is bigger than Millbrook“ heißt „London ist größer als Millbrook“."
        links:
          - title: Lernlandkarte Englisch · Stadt und Land vergleichen
            url: https://lernapps.net/apps/map/englisch/c/stadt-land-uk/
      - type: text
        text: "**Das kannst du danach:** Du vergleichst das Leben in einer Großstadt und auf dem Land. Du benutzt than, as … as und not as … as und machst keine typischen Fehler wie more busy."
  - type: section
    id: neu
    title: Stadt und Land
    blocks:
      - type: text
        text: "Eine **city** ist eine Großstadt, das **countryside** ist das Land mit Feldern und Hügeln. Beides ist oft verschieden. Vier Wörter helfen dir beim Vergleichen: **noisy** (laut), **crowded** (voll, überfüllt), **expensive** (teuer) und **cheap** (billig). Du vergleichst mit **-er … than**, **more … than** und **as … as**."
      - type: table
        caption: Klassenzimmer-Poster · Stadt und Land (meistens, nicht immer)
        header: [In der Stadt, Auf dem Land]
        rows:
          - [It is busy in a city., It is quiet in the countryside.]
          - [A city has many people and buses., The countryside has fields and hills.]
          - [Life is often fast in a city., Life is often slow in the countryside.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              - Kurze Adjektive bekommen **-er … than**: fast – **faster than**. Bei big verdoppelt sich der Mitlaut (**bigger than**), bei easy wird y zu i (**easier than**).
              - Lange Adjektive bekommen **more … than**: beautiful – **more beautiful than**.
              - Gleich ist **as … as**: Peter is as tall as Amir. Nicht gleich ist **not as … as**.
              - Nie than mit then verwechseln. Nie more und -er zusammen.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: stadt-woerter
        text: Welches Wort passt zur Situation? Ordne zu.
        pairs:
          - left: Der Bus ist am Samstag ganz voll.
            right: crowded
          - left: Die Autos hupen, und die Straße ist sehr laut.
            right: noisy
          - left: Ein Mantel kostet sehr viel Geld.
            right: expensive
          - left: Ein Eis kostet nur wenig Geld.
            right: cheap
        explanation: Ein voller Bus ist crowded, eine laute Straße ist noisy, ein Mantel für viel Geld ist expensive und ein Eis für wenig Geld ist cheap.
        hint: Überlege bei jedem Satz, ob es um Menschen, Lärm oder Geld geht.
        links:
          - title: Lernlandkarte Englisch · Stadt und Land vergleichen
            url: https://lernapps.net/apps/map/englisch/c/stadt-land-uk/
      - type: language-task
        id: stadt-form
        languages: { source: de, target: en }
        mode: choice
        task: Wähle die richtige Form.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Sophie denkt, dass in London mehr los ist als in Cornwall.
            target: London is [busier] than Cornwall.
            distractors: [[more busy, busy]]
            mistakes:
              - answer: London is more busy than Cornwall.
                message: busy ist kurz. Bei -y wird y zu i, also busier, nicht more busy.
              - answer: London is busy than Cornwall.
                message: Für einen Vergleich braucht das Adjektiv die Endung -er. Es heißt busier than.
          - cue: Sophie denkt, dass die Stadt lauter ist als das Land.
            target: The city is [noisier] than the countryside.
            distractors: [[more noisy, noisyer]]
            mistakes:
              - answer: The city is more noisy than the countryside.
                message: noisy ist kurz, es endet auf -y. Also noisier, nicht more noisy.
              - answer: The city is noisyer than the countryside.
                message: Bei -y wird y zu i, also noisier und nicht noisyer.
          - cue: Sophie denkt, dass es in London teurer ist als in Millbrook.
            target: London is [more expensive] than Millbrook.
            distractors: [[expensiver, more expensiver]]
            mistakes:
              - answer: London is expensiver than Millbrook.
                message: expensive ist ein langes Wort. Lange Adjektive bekommen more, nicht -er.
              - answer: London is more expensiver than Millbrook.
                message: Entweder more oder -er, nie beides. Bei expensive heißt es more expensive.
        hint: Kurze Adjektive bekommen -er, lange bekommen more. Bei -y wird y zu i.
      - type: single-choice
        id: stadt-gleich
        text: "Sophie sagt: „Cornwall is quieter than London.“ Welcher Satz sagt dasselbe mit not as … as?"
        options:
          - text: London is not as quiet as Cornwall.
            correct: true
            info: not as … as nimmt das Grundwort (quiet), ohne -er.
          - text: London is not as quieter as Cornwall.
            correct: false
            info: Zwischen as und as steht das Grundwort quiet. Die Endung -er gehört nur zu than.
          - text: London is not as quiet than Cornwall.
            correct: false
            info: Zu as gehört wieder as. than steht nur nach einer Steigerung.
          - text: London is not quiet as Cornwall.
            correct: false
            info: Das erste as fehlt. Es heißt not as … as.
        explanation: "Cornwall ist ruhiger als London, also ist London nicht so ruhig wie Cornwall: not as quiet as."
        hint: Zwischen den beiden as steht das Adjektiv ohne Endung.
        links:
          - title: Lernlandkarte Englisch · Stadt und Land vergleichen
            url: https://lernapps.net/apps/map/englisch/c/stadt-land-uk/
      - type: true-false
        id: stadt-fehler
        text: "Amir sagt: „The city is as busier as the countryside.“ Ist der Satz richtig gebaut?"
        answer: false
        hint: Überlege, ob zwischen as und as ein Adjektiv mit -er stehen darf.
        explanation: Zwischen as und as steht das Grundwort, also as busy as. busier gehört nur zu than.
        links:
          - title: Lernlandkarte Englisch · Stadt und Land vergleichen
            url: https://lernapps.net/apps/map/englisch/c/stadt-land-uk/
      - type: language-task
        id: stadt-schreiben
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Der Bus ist langsamer als der Zug.
            target: The bus is slower than the train.
            mistakes:
              - answer: The bus is more slow than the train.
                message: slow ist kurz. Kurze Adjektive bekommen -er, also slower.
              - answer: The bus is slower then the train.
                message: Nach dem Vergleich steht than, nicht then.
          - source: Millbrook ist nicht so voll wie London.
            target: Millbrook is not as crowded as London.
            mistakes:
              - answer: Millbrook is not as more crowded as London.
                message: Zwischen as und as steht das Adjektiv ohne more.
          - source: Das Buch ist billiger als das Spiel.
            target: The book is cheaper than the game.
            mistakes:
              - answer: The book is more cheap than the game.
                message: cheap ist kurz. Kurze Adjektive bekommen -er, also cheaper.
              - answer: The book is cheaper then the game.
                message: Nach dem Vergleich steht than, nicht then.
        hint: Kurze Adjektive bekommen -er, nach dem Vergleich steht than. Bei nicht gleich brauchst du not as … as.
      - type: language-task
        id: stadt-korrektur
        languages: { source: de, target: en }
        task: Im Satz ist ein Fehler. Schreibe den Satz richtig auf.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Millbrook is more small than London.
            target: Millbrook is smaller than London.
            mistakes:
              - answer: Millbrook is more smaller than London.
                message: Entweder more oder -er, nie beides. small ist kurz, also smaller.
          - cue: The countryside is quieter then the city.
            target: The countryside is (quieter|more quiet) than the city.
            mistakes:
              - answer: The countryside is more quieter than the city.
                message: Entweder more oder -er, nie beides. Es heißt quieter oder more quiet.
              - answer: The countryside is quieter then the city.
                message: Nach dem Vergleich steht than, nicht then.
        hint: Prüfe die Steigerung des Adjektivs und das Wort vor dem zweiten Ort. Ein Wort ist falsch.
      - type: language-task
        id: stadt-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: a-taxi-is-more-expensive-than-a-bicycle.mp3
            target: A taxi is more expensive than a bicycle.
          - audio: my-bike-is-not-as-fast-as-ellie.mp3
            target: My bike is not as fast as Ellie.
          - audio: a-big-city-is-busier-than-a-small-village.mp3
            target: A big city is busier than a small village.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: stadt-nachsprechen
        language: en
        items:
          - audio: my-town-is-smaller-than-your-city.mp3
            text: My town is smaller than your city.
          - audio: our-village-is-quieter-than-the-city.mp3
            text: Our village is quieter than the city.
          - audio: sophie-likes-the-quiet-countryside.mp3
            text: Sophie likes the quiet countryside.
        hint: Hör den Satz zuerst. Sprich dann langsam nach und achte auf than und as … as.
      - type: open-task
        id: stadt-vergleichen
        task: "Sophie vergleicht London, Millbrook und Cornwall. Schreibe drei Vergleichssätze auf Englisch über Stadt und Land."
        points:
          - text: Ein Satz hat -er … than mit einem kurzen Adjektiv (zum Beispiel busier than).
            source: /britische-inseln/stadt-land-uk/#neu
          - text: Ein Satz hat more … than mit einem langen Adjektiv (zum Beispiel more expensive than).
            source: /britische-inseln/stadt-land-uk/#neu
          - text: Ein Satz hat as … as oder not as … as mit dem Grundwort.
            source: /britische-inseln/stadt-land-uk/#neu
          - text: Es sind drei ganze Sätze mit Punkt am Ende.
            kind: form
        solution: |
          London is busier than Cornwall. Shops in London are more crowded than shops in Millbrook. Millbrook is not as big as London.
  - type: section
    id: weiter
    title: Weiter nach London
    blocks:
      - type: text
        text: "Das Kapitel ist geschafft. Nächste Woche fährt die Klasse mit Mr Hill für einen Tag nach London. Im nächsten Kapitel geht es dorthin. Vorher schau dir den Rückblick an:"
      - type: table
        caption: Schulkalender · Rückblick Kapitel 2
        header: [Seite, Das kannst du, Beispiel]
        rows:
          - [Die Karte, Teile des UK und Hauptstädte zeigen, The UK has four parts.]
          - [Eine Region, eine Region vorstellen, The park is in the north of Millbrook.]
          - [Stadt und Land, Orte vergleichen, Peter is as tall as Amir.]
